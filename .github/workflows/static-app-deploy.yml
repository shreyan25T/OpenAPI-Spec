name: Minimal Azure Static Web App deploy

on:
  push:
    branches:
      - staticapp-ci-test 

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.DEV_STATICWEBAPP_DEPLOYTOKEN }}
          repo_token: ${{ secrets.GIT_REPO_TOKEN }}
          action: "upload"
          app_location: "frontend/"
          output_location: "build/"
