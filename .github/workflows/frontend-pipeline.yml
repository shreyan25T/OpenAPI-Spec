name: AutoGen-TestCases Frontend (React)

on:
  push:
    branches:
      - uat-deploy
    paths-ignore:
      - backend/**

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Adding .env
        run: |
          echo "DISABLE_ESLINT_PLUGIN=true" > frontend/.env
          echo "REACT_APP_DOMAIN=${{ secrets.REACT_APP_DOMAIN }}" >> frontend/.env
          echo "REACT_APP_CLIENT_ID=${{ secrets.REACT_APP_CLIENT_ID }}" >> frontend/.env
          echo "REACT_APP_API_URL=https://autogen-testcases-webapp-dev-dkc5gfa0ebbhbedf.eastus-01.azurewebsites.net/" >> frontend/.env
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.DEV_STATICWEBAPP_DEPLOYTOKEN }}
          repo_token: ${{ secrets.GIT_REPO_TOKEN }}
          action: "upload"
          app_location: "frontend/"
          output_location: "build/"
